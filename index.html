<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>កត់ត្រាម៉ោងឡាន</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e2e7ef;--acc:#2563eb;--tg:#229ED9;--danger:#dc2626;--ok:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Khmer','Khmer Sangam MN','Khmer OS Battambang','Khmer UI',system-ui,sans-serif;line-height:1.5;padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.app{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 2px 10px}
header h1{font-size:19px;margin:0}
#clock{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e6eaf2;padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
section[hidden]{display:none}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lab{flex:0 0 auto;font-weight:600}
.val{flex:1 1 130px;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;font:inherit;color:inherit;padding:2px 0;outline:none}
.val:focus{border-bottom-color:var(--acc)}
.scanbox{flex:0 0 auto;width:54px;height:54px;border:2px dashed var(--acc);border-radius:12px;background:#eff4ff;color:var(--acc);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer}
.scanbox span{font-size:22px}
.scanbox:active{background:#dbe7ff}
.gear{flex:0 0 auto;border:0;background:transparent;font-size:18px;color:var(--mut);cursor:pointer;padding:6px}
.nowbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;padding:5px 8px;cursor:pointer;line-height:1.2}
.nowbtn:active{background:#eef2f8}
.presets{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px}
.pradio{flex:0 0 auto;width:22px;height:22px;accent-color:var(--acc)}
.plab{flex:0 0 auto;font-size:15px;color:var(--mut)}
.ptext{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:17px;font-weight:600;color:var(--ink)}
.pdel{padding:6px 10px}
.addcar{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);gap:10px;flex-direction:column}
.row.open .tools{display:flex}
.tools .t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.tools .t > b{flex:0 0 52px;font-weight:600}
.tools input[type=text]{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)}
.tools input[type=range]{flex:1}
.tools input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{background:#f1f4f9}
.btn.danger{color:var(--danger)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.tg{background:var(--tg);border-color:var(--tg);color:#fff;font-size:16px;padding:13px}
.actions{display:grid;gap:8px;margin-top:14px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .three{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card input.big{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:20px;font-weight:600;text-align:center;color:var(--ink)}
.card input.big:focus{outline:2px solid #bcd0ff;border-color:var(--acc)}
.qrwrap{display:flex;justify-content:center;margin:14px 0;min-height:120px;align-items:center}
.qrwrap canvas{width:100%;max-width:300px;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.hint{color:var(--mut);font-size:13px;text-align:center}
.qrbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;font-weight:600;font-size:17px;word-break:break-all}
.item .btn{padding:7px 10px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.65);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.vidwrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.vidwrap video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18% 18%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.status{margin:10px 2px;font-size:14px;color:var(--mut);min-height:22px}
.sheetBtns{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c2430;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.photos{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptitle{font-weight:600;font-size:15px}
.capin{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;border:3px solid;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.capov{position:absolute;left:0;right:0;bottom:0;color:#fff;font-size:10px;font-weight:600;text-align:center;padding:3px 2px;line-height:1.25}
.tdel{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer}
#lightbox{z-index:60;align-items:center;padding:12px}
#lightbox .sheet{border-radius:18px;max-height:92vh;overflow:auto}
#lbImg{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:#111;display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🚚 កត់ត្រាម៉ោងឡាន</h1>
    <div id="clock"></div>
  </header>

  <!-- ===== TAB 1: LOG ===== -->
  <section id="secLog">
    <div id="rows"></div>
    <div class="actions">
      <button class="btn tg" id="btnTg">✈️ ចែករំលែកអក្សរចូល Telegram</button>
      <button class="btn tg" id="btnAlbum">🖼 ចែករំលែករូប Album</button>
      <button class="btn primary" id="btnSavePng">💾 Save PNG ទាំង ២ ក្រឡា (មកដល់ + ចេញ)</button>
      <div class="two">
        <button class="btn" id="btnCopy">📋 ចម្លងអក្សរ</button>
        <button class="btn primary" id="btnSave">💾 រក្សាទុក</button>
      </div>
      <div class="three">
        <button class="btn danger" id="btnClearPhotos">🗑 លុបរូបទាំងអស់</button>
        <button class="btn danger" id="btnReset">↺ ស្តារដើម</button>
      </div>
    </div>
  </section>
</div>

<!-- Scanner modal -->
<div class="modal" id="scanModal" hidden>
  <div class="sheet">
    <div class="sheetHead"><b id="scanTitle">Scan QR code</b><button class="btn" id="scanClose">✕ បិទ</button></div>
    <div class="vidwrap"><video id="vid" playsinline muted></video><div class="frame"></div></div>
    <div class="status" id="scanStatus"></div>
    <div class="sheetBtns">
      <button class="btn primary" id="shootBtn">📸 ថតរូប <span id="shotCount"></span></button>
      <button class="btn" id="camBtn">📷 បើក Camera Scan</button>
      <button class="btn" id="photoBtn">🖼 ថតរូប QR ជំនួស (បើ Camera ខាងលើមិនបើក)</button>
      <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
      <input type="file" id="shootIn" accept="image/*" capture="environment" hidden>
    </div>
  </div>
</div>
<div class="modal" id="lightbox" hidden>
  <div class="sheet">
    <div class="sheetHead"><b>រូបថត</b><button class="btn" id="lbClose">✕ បិទ</button></div>
    <img id="lbImg" alt="">
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const nowTime = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const today = () => { const d=new Date(); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
const uid = () => Math.random().toString(36).slice(2,9);
const norm = s => (s||'').replace(/\s+/g,'').toUpperCase();

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(k==='value') el.value = v;
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => el.append(c));
  return el;
}
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- Library loader (CDN, cached in localStorage for offline use) ---------- */
function loadLib(key, urls, globalName){
  return (async()=>{
    if(window[globalName]) return;
    let code=null;
    try{ code=localStorage.getItem('lib.'+key); }catch(e){}
    if(!code){
      for(const u of urls){
        try{ const r=await fetch(u); if(r.ok){ code=await r.text(); break; } }catch(e){}
      }
      if(code){ try{ localStorage.setItem('lib.'+key, code); }catch(e){} }
    }
    if(!code) throw new Error('lib-unavailable');
    const s=document.createElement('script'); s.textContent=code; document.head.appendChild(s);
    if(!window[globalName]){ try{ localStorage.removeItem('lib.'+key); }catch(e){} throw new Error('lib-bad'); }
  })();
}
const HAS_DETECTOR = 'BarcodeDetector' in window;
let jsqrP = null;
function ensureJsQR(){
  if(!jsqrP){
    jsqrP = loadLib('jsqr',[
      'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'
    ],'jsQR');
    jsqrP.catch(()=>{ jsqrP=null; });
  }
  return jsqrP;
}

/* ---------- Data ---------- */
const LS_ROWS='carlog.rows.v1', LS_QR='carlog.qrs.v1';
const MAX_CARS = 10;
const defaultPresets = () => ['EZ 194','M 15','M 89','G 179','M G45'].map(t=>({id:uid(),text:t}));
const defaults = () => [
  {id:uid(),type:'text', label:'',                 value:'វីរះប៊ុនថាំ ត្មាតពង (KS)', size:26,color:'#1c2430'},
  {id:uid(),type:'car',  label:'លេខឡាន',           value:'EZ 192', presets:defaultPresets(), picked:null, size:24,color:'#1c2430'},
  {id:uid(),type:'arrive',label:'ឡានមកដល់ម៉ោង:',   value:'',                          size:24,color:'#15803d'},
  {id:uid(),type:'depart',label:'ឡានចេញទៅវិញម៉ោង:',value:'',                          size:24,color:'#b91c1c'},
  {id:uid(),type:'date', label:'',                 value:today(), auto:true,            size:22,color:'#1c2430'}
];
function loadRows(){
  try{
    const a=JSON.parse(localStorage.getItem(LS_ROWS));
    if(Array.isArray(a) && a.length) return a;
  }catch(e){}
  return defaults();
}
let rows = loadRows();
rows.forEach(r=>{
  if(r.type==='date' && r.auto) r.value=today();
  if(r.type==='car' && !Array.isArray(r.presets)) r.presets=defaultPresets();
  if(r.type==='car' && r.picked===undefined){ const m=r.presets.find(p=>p.text&&norm(p.text)===norm(r.value)); r.picked=m?m.id:null; }
});
function saveRows(){ try{ localStorage.setItem(LS_ROWS, JSON.stringify(rows)); }catch(e){} }
saveRows();

/* ---------- Render log rows ---------- */
/* ---------- Photos (stored in IndexedDB) ---------- */
const GROUPS = {
  arrive:{max:3,color:'#15803d',title:'រូបឡានមកដល់',def:'សៀលចូលមកដល់ VET ត្មាតពង (KS)'},
  depart:{max:3,color:'#b91c1c',title:'រូបឡានចេញទៅវិញ',def:'សៀលចេញពី VET ត្មាតពង (KS)'},
  extra :{max:5,color:'#2563eb',title:'រូបបន្ថែម',def:''}
};
const LS_CAPS='carlog.caps.v1';
const defCaps=()=>({arrive:GROUPS.arrive.def,depart:GROUPS.depart.def,extra:GROUPS.extra.def});
let caps=Object.assign(defCaps(),(()=>{try{return JSON.parse(localStorage.getItem(LS_CAPS))||{};}catch(e){return {};}})());
const saveCaps=()=>{ try{ localStorage.setItem(LS_CAPS,JSON.stringify(caps)); }catch(e){} };
const capOf=g=>caps[g]||'';
const keyOf=g=>capOf(g)+'|'+GROUPS[g].color;
let photos=[], db=null, shareOffset=0, prepT=null, lbUrl=null;
const stamped=new Map();

function idbOpen(){
  return new Promise(res=>{
    try{
      const rq=indexedDB.open('carlog',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('photos',{keyPath:'id'});
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function dbAll(){
  return new Promise(res=>{
    if(!db) return res([]);
    try{ const rq=db.transaction('photos').objectStore('photos').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]); }
    catch(e){ res([]); }
  });
}
function dbPut(p){ if(!db) return; try{ db.transaction('photos','readwrite').objectStore('photos').put({id:p.id,group:p.group,blob:p.blob,ts:p.ts}); }catch(e){} }
function dbClear(){ if(!db) return; try{ db.transaction('photos','readwrite').objectStore('photos').clear(); }catch(e){} }
function dbDel(id){ if(!db) return; try{ db.transaction('photos','readwrite').objectStore('photos').delete(id); }catch(e){} }

/* draw the coloured frame + caption band onto a photo */
async function stampBlob(blob, caption, color, mime){
  const im=await loadImg(blob);
  try{ await Promise.race([document.fonts.load('700 40px "Noto Sans Khmer"'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  const W=im.naturalWidth, H=im.naturalHeight, b=Math.round(W*0.025), cap=(caption||'').trim();
  const fam='"Noto Sans Khmer","Khmer Sangam MN","Khmer UI",system-ui,sans-serif';
  const c=document.createElement('canvas'), x=c.getContext('2d');
  let fs=Math.round(W*0.05);
  if(cap){ x.font='700 '+fs+'px '+fam; while(x.measureText(cap).width>W && fs>Math.round(W*0.03)){ fs-=2; x.font='700 '+fs+'px '+fam; } }
  const band=cap?Math.round(fs*1.9):b;
  c.width=W+2*b; c.height=H+b+band;
  x.fillStyle=color; x.fillRect(0,0,c.width,c.height);
  x.drawImage(im,b,b,W,H);
  if(cap){
    x.font='700 '+fs+'px '+fam; x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(cap,c.width/2,b+H+band/2,W);
  }
  return new Promise(res=>mime==='image/png' ? c.toBlob(res,'image/png') : c.toBlob(res,'image/jpeg',0.9));
}

/* ---------- Save framed photos as PNG (per box, or both boxes at once) ---------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const safeName = s => String(s||'').trim().replace(/[\\/:*?"<>|\s]+/g,'_').replace(/^_+|_+$/g,'');
async function savePNGs(groups){
  const list=groups.flatMap(g=>photos.filter(p=>p.group===g));
  if(!list.length) return toast('មិនទាន់មានរូប');
  toast('កំពុងរៀបចំ PNG...');
  const car=(rows.find(r=>r.type==='car')||{}).value||'', stampDate=today().replace(/\//g,'-');
  const cnt={}, files=[];
  try{
    for(const p of list){
      const b=await stampBlob(p.blob,capOf(p.group),GROUPS[p.group].color,'image/png');
      if(!b) throw new Error('png-null');
      cnt[p.group]=(cnt[p.group]||0)+1;
      const nm=['VET',car?safeName(car):'',stampDate,p.group,cnt[p.group]].filter(Boolean).join('_')+'.png';
      files.push(new File([b],nm,{type:'image/png'}));
    }
  }catch(e){ return toast('បង្កើត PNG មិនបាន'); }
  /* iPhone: share sheet has "Save Image" (to Photos). Others: direct download. */
  if(IS_IOS && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return; }
    catch(err){ if(err&&err.name==='AbortError') return; }
  }
  files.forEach((f,i)=>setTimeout(()=>downloadFile(f),i*500));
  toast('⬇️ បានរក្សាទុក PNG '+files.length+' សន្លឹក');
}
function schedulePrepare(){ clearTimeout(prepT); prepT=setTimeout(prepareStamped,500); updateAlbumBtn(); }
async function prepareStamped(){
  for(const p of photos){
    const e=stamped.get(p.id);
    if(e && e.key===keyOf(p.group)) continue;
    try{ const b=await stampBlob(p.blob,capOf(p.group),GROUPS[p.group].color); stamped.set(p.id,{key:keyOf(p.group),blob:b}); }catch(err){}
  }
}
async function addPhoto(g,blob){
  const p={id:uid(),group:g,blob,ts:Date.now(),url:URL.createObjectURL(blob)};
  photos.push(p); dbPut(p); shareOffset=0; render(); updateShotUI(); schedulePrepare();
  try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){}
  toast('📸 '+photos.filter(x=>x.group===g).length+'/'+GROUPS[g].max);
}
function delPhoto(id){
  const p=photos.find(x=>x.id===id); if(!p) return;
  URL.revokeObjectURL(p.url); photos=photos.filter(x=>x!==p); stamped.delete(id); dbDel(id);
  shareOffset=0; render(); updateShotUI(); updateAlbumBtn();
}
function clearAllPhotos(){
  if(!photos.length) return;
  if(!confirm('លុបរូបទាំងអស់ ('+photos.length+' សន្លឹក)?')) return;
  photos.forEach(p=>URL.revokeObjectURL(p.url));
  photos=[]; stamped.clear(); dbClear(); shareOffset=0;
  $('lightbox').hidden=true;
  render(); updateShotUI(); updateAlbumBtn(); toast('🗑 បានលុបរូបទាំងអស់');
}
$('btnClearPhotos').onclick=clearAllPhotos;
async function openLightbox(p){
  const b=await stampBlob(p.blob,capOf(p.group),GROUPS[p.group].color);
  if(lbUrl) URL.revokeObjectURL(lbUrl);
  lbUrl=URL.createObjectURL(b); $('lbImg').src=lbUrl; $('lightbox').hidden=false;
}
$('lbClose').onclick=()=>{ $('lightbox').hidden=true; };
$('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') $('lightbox').hidden=true; });

function photoPanel(g){
  const cfg=GROUPS[g], list=photos.filter(p=>p.group===g);
  const wrap=h('div',{class:'photos'});

function downloadFile(f){
  const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function copyTextQuiet(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>{}); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.append(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
async function shareAlbum(){
  if(!needCar()) return;
  copyTextQuiet(shareText());   /* text is on the clipboard: paste it into the caption box in Telegram */
  const list=['arrive','depart','extra'].flatMap(g=>photos.filter(p=>p.group===g));
  if(!list.length) return toast('មិនទាន់មានរូប');
  if(shareOffset>=list.length) shareOffset=0;
  const batch=list.slice(shareOffset,shareOffset+10);          /* Telegram album limit = 10 */
  const ready=batch.every(p=>{ const e=stamped.get(p.id); return e&&e.key===keyOf(p.group); });
  if(!ready){ toast('កំពុងរៀបចំរូប...'); await prepareStamped(); toast('រួចរាល់ — ចុចម្តងទៀត'); return; }
  const files=batch.map((p,i)=>new File([stamped.get(p.id).blob],'car-'+(shareOffset+i+1)+'.jpg',{type:'image/jpeg'}));
  const data={files};   /* files only: adding text makes Telegram split the album */
  try{
    if(navigator.canShare && navigator.canShare({files})) await navigator.share(data);
    else{ files.forEach((f,i)=>setTimeout(()=>downloadFile(f),i*400)); toast('បានទាញយករូប — ផ្ញើក្នុង Telegram ដោយខ្លួនឯង'); }
  }catch(err){
    if(err&&err.name==='AbortError') return;
    toast('ចែករំលែកមិនបាន'); return;
  }
  shareOffset+=batch.length;
  if(shareOffset>=list.length) shareOffset=0; else toast('នៅសល់ '+(list.length-shareOffset)+' សន្លឹក — ចុចម្តងទៀត');
  updateAlbumBtn();
}

/* ---------- Apply scan result ---------- */
function syncPick(car){
  const m=(car.presets||[]).find(p=>p.text&&norm(p.text)===norm(car.value));
  car.picked=m?m.id:null;
}
/* sharing needs the car number to be ticked */
function needCar(){
  const car=rows.find(r=>r.type==='car');
  if(car && !car.picked){ toast('សូមចុចជ្រើសរើសលេខឡាន'); return false; }
  const arr=rows.find(r=>r.type==='arrive'), dep=rows.find(r=>r.type==='depart');
  if(arr && !(arr.stamped && arr.value)){ toast('សូមចុចរូបម៉ោង ⏱ ឡានមកដល់ សិន'); return false; }
  if(dep && !(dep.stamped && dep.value)){ toast('សូមចុចរូបម៉ោង ⏱ ឡានចេញទៅវិញ សិន'); return false; }
  return true;
}
function applyScan(kind, payload){
  const t=nowTime(), d=today();
  const car=rows.find(r=>r.type==='car'), arr=rows.find(r=>r.type==='arrive'),
        dep=rows.find(r=>r.type==='depart'), date=rows.find(r=>r.type==='date');
  let msg;
  if(kind==='arrive'){
    if(arr){ arr.value=t; arr.stamped=true; }
    if(payload && car){ car.value=payload; syncPick(car); }
    msg='✅ ឡានមកដល់ '+t+(payload?' · '+payload:'');
  }else{
    if(dep){ dep.value=t; dep.stamped=true; }
    if(payload && car){
      if(!car.value){ car.value=payload; syncPick(car); }
      else if(norm(payload)!==norm(car.value)) msg='⚠️ QR ('+payload+') ខុសពីលេខឡាន ('+car.value+')';
    }
    msg = msg || ('✅ ឡានចេញ '+t);
  }
  if(date){ date.value=d; date.auto=true; }
  saveRows(); render(); toast(msg);
}

/* ---------- Scanner ---------- */
let stream=null, scanTimer=null, scanKind=null, scanMode='scan', scanning=false, session=0, detector=null;
const vid=$('vid'), cvs=document.createElement('canvas'), cctx=cvs.getContext('2d',{willReadFrequently:true});
const setStatus = m => $('scanStatus').textContent=m;
function stopCamera(){
  scanning=false; clearTimeout(scanTimer);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  vid.srcObject=null;
}
function openScanner(kind, mode){
  scanKind=kind; scanMode=(kind==='extra')?'photo':(mode||'scan');
  const nm={arrive:'ឡានមកដល់',depart:'ឡានចេញទៅវិញ',extra:'រូបបន្ថែម'}[kind];
  $('scanTitle').textContent = (scanMode==='photo'?'📸 ថតរូប · ':'Scan QR · ')+nm;
  $('photoBtn').hidden = scanMode==='photo';
  $('scanModal').hidden=false;
  updateShotUI();
  startCamera();
}
function updateShotUI(){
  const g=scanKind; if(!g) return;
  const n=photos.filter(p=>p.group===g).length, m=GROUPS[g].max;
  $('shotCount').textContent='('+n+'/'+m+')';
  $('shootBtn').disabled=n>=m;
}
function closeScanner(){ session++; stopCamera(); $('scanModal').hidden=true; }
function explain(e){
  const alt = scanMode==='photo' ? 'ប៊ុត្តុង «ថតរូប»' : '«ថតរូប QR ជំនួស»';
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return 'ទំព័រនេះមិនអាចបើក Camera ផ្ទាល់បានទេ (ត្រូវបើកតាម https ក្នុង Chrome/Safari)។ សូមប្រើ '+alt+' ខាងក្រោម។';
  if(e&&e.name==='NotAllowedError') return 'Camera ត្រូវបានបដិសេធ។ សូមអនុញ្ញាតក្នុង Settings របស់ browser រួចចុចបើក Camera ម្តងទៀត ឬប្រើ '+alt+'។';
  if(e&&e.name==='NotFoundError') return 'រកមិនឃើញ Camera។ សូមប្រើ '+alt+'។';
  return 'មិនអាចបើក Camera ('+((e&&e.name)||'error')+')។ សូមប្រើ '+alt+'។';
}
async function startCamera(){
  const my=++session; stopCamera();
  setStatus('កំពុងបើក Camera...');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ setStatus('⚠️ '+explain()); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){ if(my===session) setStatus('⚠️ '+explain(e)); return; }
  if(my!==session){ stream.getTracks().forEach(t=>t.stop()); stream=null; return; }
  vid.srcObject=stream;
  try{ await vid.play(); }catch(e){}
  if(scanMode==='photo'){ setStatus('ប៉ះ «ថតរូប» ដើម្បីថត'); return; }
  detector=null;
  if(HAS_DETECTOR){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; } }
  if(!detector){
    try{ await ensureJsQR(); }catch(e){ if(my===session) setStatus('⚠️ ត្រូវការអ៊ីនធឺណិតម្តង ដើម្បីទាញ QR reader'); return; }
  }
  if(my!==session) return;
  setStatus('ដាក់ QR code ក្នុងស៊ុម...');
  scanning=true; tick(my);
}
async function tick(my){
  if(!scanning||my!==session) return;
  try{
    if(vid.readyState>=2 && vid.videoWidth){
      let text=null;
      if(detector){
        const codes=await detector.detect(vid);
        if(codes.length) text=codes[0].rawValue;
      }else if(window.jsQR){
        const w=Math.min(vid.videoWidth,640), hh=Math.round(vid.videoHeight*w/vid.videoWidth);
        cvs.width=w; cvs.height=hh; cctx.drawImage(vid,0,0,w,hh);
        const img=cctx.getImageData(0,0,w,hh);
        const res=jsQR(img.data,w,hh,{inversionAttempts:'attemptBoth'});
        if(res) text=res.data;
      }
      if(text && my===session){ onDecoded(text); return; }
    }
  }catch(e){}
  scanTimer=setTimeout(()=>tick(my),150);
}
function onDecoded(text){
  const payload=String(text).replace(/^CAR[:：]\s*/i,'').trim();
  const kind=scanKind;
  closeScanner();
  try{ navigator.vibrate&&navigator.vibrate(120); }catch(e){}
  applyScan(kind,payload);
}
$('scanClose').onclick=closeScanner;
$('camBtn').onclick=startCamera;
function downscaleToBlob(src,w0,h0){
  return new Promise(res=>{
    const sc=Math.min(1,1280/Math.max(w0,h0)), w=Math.round(w0*sc), hh=Math.round(h0*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(src,0,0,w,hh);
    c.toBlob(res,'image/jpeg',0.85);
  });
}
$('shootBtn').onclick=async()=>{
  const g=scanKind; if(!g) return;
  if(photos.filter(p=>p.group===g).length>=GROUPS[g].max) return toast('រូបពេញហើយ');
  if(stream && vid.readyState>=2 && vid.videoWidth){
    const b=await downscaleToBlob(vid,vid.videoWidth,vid.videoHeight);
    if(b) addPhoto(g,b);
  }else $('shootIn').click();
};
$('shootIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  const g=scanKind; if(!f||!g) return;
  try{ const im=await loadImg(f); const b=await downscaleToBlob(im,im.naturalWidth,im.naturalHeight); if(b) addPhoto(g,b); }
  catch(err){ toast('ថតរូបមិនបាន'); }
});
/* Fallback: take a photo with the phone's own camera app, then decode it */
function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),10000); };
    im.onerror=()=>rej(new Error('img'));
    im.src=u;
  });
}
async function decodeImage(im){
  const s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.round(im.naturalWidth*s), hh=Math.round(im.naturalHeight*s);
  cvs.width=w; cvs.height=hh; cctx.drawImage(im,0,0,w,hh);
  if(HAS_DETECTOR){
    try{ const d=new BarcodeDetector({formats:['qr_code']}); const c=await d.detect(cvs); if(c.length) return c[0].rawValue; }catch(e){}
  }
  await ensureJsQR();
  const res=jsQR(cctx.getImageData(0,0,w,hh).data,w,hh,{inversionAttempts:'attemptBoth'});
  return res?res.data:null;
}
$('photoBtn').onclick=()=>$('photoIn').click();
$('photoIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f) return;
  stopCamera(); setStatus('កំពុងអានរូប QR...');
  try{
    const text=await decodeImage(await loadImg(f));
    if(text) onDecoded(text);
    else setStatus('⚠️ រកមិនឃើញ QR ក្នុងរូប — សូមថតឱ្យជិត ច្បាស់ ហើយឱ្យ QR ពេញស៊ុម រួចសាកម្តងទៀត');
  }catch(err){
    setStatus('⚠️ អានរូបមិនបាន — ពិនិត្យអ៊ីនធឺណិតម្តង (ដើម្បីទាញ QR reader) ឬសាកម្តងទៀត');
  }
});

/* ---------- Log actions ---------- */
function shareText(){
  return rows.map(r=>((r.label?r.label+' ':'')+(r.value||'')).trim()).filter(Boolean).map(l=>'- '+l).join('\n');
}
$('btnTg').onclick=()=>{
  if(!needCar()) return;
  const t=shareText();
  window.open('https://t.me/share/url?url=&text='+encodeURIComponent(t),'_blank');
};
$('btnCopy').onclick=async()=>{
  if(!needCar()) return;
  const t=shareText();
  try{ await navigator.clipboard.writeText(t); toast('បានចម្លង'); }
  catch(e){ const ta=h('textarea',{},t); document.body.append(ta); ta.select(); try{document.execCommand('copy');toast('បានចម្លង');}catch(_){toast('ចម្លងមិនបាន');} ta.remove(); }
};
$('btnSave').onclick=()=>{ saveRows(); saveCaps(); toast('💾 បានរក្សាទុក'); };
$('btnReset').onclick=()=>{
  if(!confirm('ស្តារទៅលំនាំដើម? (ក្រឡាលេខឡាន និងបញ្ជីលេខឡាន មិនប៉ះពាល់ទេ)')) return;
  const keepCar=rows.find(r=>r.type==='car');      /* car number box stays exactly as the user left it */
  rows=defaults();
  if(keepCar){ keepCar.picked=null; const i=rows.findIndex(r=>r.type==='car'); if(i>=0) rows[i]=keepCar; }   /* tick is cleared: must tick again */
  openIds.clear(); saveRows(); render();
};



/* ---------- Live clock ---------- */
function tickClock(){ $('clock').textContent=nowTime()+' · '+today(); }
tickClock(); setInterval(tickClock,1000);
</script>
